<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabla | Toque & Pase</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#050816;color:white;display:flex;}
.sidebar{width:260px;height:100vh;background:#0b1020;border-right:1px solid #1f2937;padding:25px;position:fixed;overflow-y:auto;}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:40px;}
.logo-box{width:50px;height:50px;background:#00f5a0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;color:#000;}
.logo-text h2{font-size:28px;color:#00f5a0;}
.logo-text p{font-size:12px;color:#94a3b8;}
.menu-title{margin:30px 0 15px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#6b7280;}
.sidebar a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;text-decoration:none;color:#d1d5db;transition:0.3s;margin-bottom:8px;}
.sidebar a:hover,.sidebar a.active{background:#00f5a015;color:#00f5a0;}
.main{margin-left:260px;width:100%;padding:30px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
.search{width:350px;padding:14px 18px;background:#111827;border:1px solid #1f2937;border-radius:14px;outline:none;color:white;font-size:15px;}
.avatar{width:45px;height:45px;border-radius:50%;background:#00f5a0;}
.section-title{margin-bottom:20px;font-size:26px;}

/* TABS */
.tabs{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap;}
.tab{padding:10px 20px;border-radius:12px;border:1px solid #1f2937;background:#111827;color:#9ca3af;cursor:pointer;font-size:14px;font-weight:600;transition:0.3s;}
.tab:hover{border-color:#00f5a0;color:#00f5a0;}
.tab.active{background:#00f5a015;border-color:#00f5a0;color:#00f5a0;}

/* TABLA */
.tabla-container{background:#111827;border:1px solid #1f2937;border-radius:20px;overflow:hidden;display:none;}
.tabla-container.active{display:block;}
.liga-header{padding:20px 25px;border-bottom:1px solid #1f2937;display:flex;align-items:center;gap:10px;}
.liga-header h3{font-size:18px;font-weight:600;}

table{width:100%;border-collapse:collapse;}
thead{background:#0b1020;}
th{padding:14px 16px;text-align:left;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#6b7280;}
th.center,td.center{text-align:center;}
td{padding:12px 16px;border-top:1px solid #1f2937;font-size:14px;}
tr:hover td{background:#0b1220;}
.pos{color:#9ca3af;font-weight:600;width:35px;text-align:center;}
.top4{color:#60a5fa;}
.top1{color:#00f5a0;}
.relegado{color:#f87171;}
.team-name{font-weight:600;}
.pts{color:#00f5a0;font-weight:700;font-size:16px;text-align:center;}
.num{text-align:center;color:#9ca3af;}

.loading{color:#00f5a0;font-size:16px;padding:30px;text-align:center;}
.error-msg{color:#ff6b6b;padding:20px;text-align:center;}

@media(max-width:768px){
  .sidebar{width:100px;padding:15px;}
  .logo-text,.menu-title,.sidebar a span{display:none;}
  .main{margin-left:100px;padding:15px;}
  .search{width:160px;}
  th,td{padding:8px 10px;font-size:12px;}
  .tab{padding:8px 14px;font-size:13px;}
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <div class="logo-box">⚽</div>
    <div class="logo-text"><h2>Toque & Pase</h2><p>Fútbol en tiempo real</p></div>
  </div>
  <div class="menu-title">Principal</div>
  <a href="index.html">🏠 <span>Inicio</span></a>
  <a href="noticias.html">📰 <span>Noticias</span></a>
  <a href="partidos.html">📅 <span>Partidos</span></a>
  <a class="active" href="tabla.html">📊 <span>Tabla</span></a>
  <a href="equipos.html">👥 <span>Equipos</span></a>
  <a href="jugadores.html">⭐ <span>Jugadores</span></a>
  <a href="historia.html">📖 <span>Historia</span></a>
  <a href="comunidad.html">💬 <span>Comunidad</span></a>
</div>

<div class="main">
  <div class="topbar">
    <input class="search" type="text" placeholder="Buscar equipos, jugadores o ligas...">
    <div class="avatar"></div>
  </div>

  <h2 class="section-title">📊 Tablas de Posiciones</h2>

  <div class="tabs" id="tabs">
    <div class="loading">⏳ Cargando ligas...</div>
  </div>

  <div id="tablas"></div>
</div>

<script>
async function cargarTablas(){
  const tabsEl = document.getElementById("tabs");
  const tablasEl = document.getElementById("tablas");

  try{
    const response = await fetch("/api/tabla");
    if(!response.ok) throw new Error(`Error ${response.status}`);
    const data = await response.json();

    tabsEl.innerHTML = "";
    tablasEl.innerHTML = "";

    data.ligas.forEach((liga, i) => {

      // Tab
      const tab = document.createElement("div");
      tab.className = "tab" + (i === 0 ? " active" : "");
      tab.textContent = `${liga.pais} ${liga.nombre}`;
      tab.dataset.index = i;
      tab.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".tabla-container").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(`liga-${i}`).classList.add("active");
      };
      tabsEl.appendChild(tab);

      // Tabla
      const container = document.createElement("div");
      container.className = "tabla-container" + (i === 0 ? " active" : "");
      container.id = `liga-${i}`;

      if(!liga.tabla || liga.tabla.length === 0){
        container.innerHTML = `
          <div class="liga-header"><h3>${liga.pais} ${liga.nombre}</h3></div>
          <p class="error-msg">No se pudo cargar esta liga.</p>
        `;
      } else {
        let filas = liga.tabla.map((t, idx) => {
          let posClass = "";
          if(idx === 0) posClass = "top1";
          else if(idx < 4) posClass = "top4";
          else if(idx >= liga.tabla.length - 3) posClass = "relegado";

          return `
            <tr>
              <td class="pos ${posClass}">${t.position}</td>
              <td class="team-name">${t.team.name}</td>
              <td class="num">${t.playedGames}</td>
              <td class="num">${t.won}</td>
              <td class="num">${t.draw}</td>
              <td class="num">${t.lost}</td>
              <td class="num">${t.goalsFor}:${t.goalsAgainst}</td>
              <td class="num">${t.goalDifference > 0 ? '+' : ''}${t.goalDifference}</td>
              <td class="pts">${t.points}</td>
            </tr>
          `;
        }).join("");

        container.innerHTML = `
          <div class="liga-header">
            <h3>${liga.pais} ${liga.nombre}</h3>
          </div>
          <table>
            <thead>
              <tr>
                <th class="center">#</th>
                <th>Equipo</th>
                <th class="center">PJ</th>
                <th class="center">G</th>
                <th class="center">E</th>
                <th class="center">P</th>
                <th class="center">Goles</th>
                <th class="center">DG</th>
                <th class="center">Pts</th>
              </tr>
            </thead>
            <tbody>${filas}</tbody>
          </table>
        `;
      }

      tablasEl.appendChild(container);
    });

  }catch(error){
    tabsEl.innerHTML = `<p class="error-msg">❌ Error: ${error.message}</p>`;
  }
}

cargarTablas();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabla | Toque & Pase</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#050816;color:white;display:flex;}
.sidebar{width:260px;height:100vh;background:#0b1020;border-right:1px solid #1f2937;padding:25px;position:fixed;overflow-y:auto;}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:40px;}
.logo-box{width:50px;height:50px;background:#00f5a0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;color:#000;}
.logo-text h2{font-size:28px;color:#00f5a0;}
.logo-text p{font-size:12px;color:#94a3b8;}
.menu-title{margin:30px 0 15px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#6b7280;}
.sidebar a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;text-decoration:none;color:#d1d5db;transition:0.3s;margin-bottom:8px;}
.sidebar a:hover,.sidebar a.active{background:#00f5a015;color:#00f5a0;}
.main{margin-left:260px;width:100%;padding:30px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
.search{width:350px;padding:14px 18px;background:#111827;border:1px solid #1f2937;border-radius:14px;outline:none;color:white;font-size:15px;}
.avatar{width:45px;height:45px;border-radius:50%;background:#00f5a0;}
.section-title{margin-bottom:20px;font-size:26px;}

.tabla-container{background:#111827;border:1px solid #1f2937;border-radius:20px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead{background:#0b1020;}
th{padding:16px 20px;text-align:left;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#6b7280;}
td{padding:14px 20px;border-top:1px solid #1f2937;font-size:15px;}
tr:hover td{background:#0b1220;}
.pos{color:#9ca3af;font-weight:600;width:40px;}
.team-name{font-weight:600;}
.pts{color:#00f5a0;font-weight:700;font-size:17px;}
.goles{color:#9ca3af;}

.loading{color:#00f5a0;font-size:18px;padding:20px;}
.error-msg{color:#ff6b6b;padding:20px;}

@media(max-width:768px){
  .sidebar{width:100px;padding:15px;}
  .logo-text,.menu-title,.sidebar a span{display:none;}
  .main{margin-left:100px;padding:20px;}
  .search{width:180px;}
  th,td{padding:10px;}
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <div class="logo-box">⚽</div>
    <div class="logo-text"><h2>Toque & Pase</h2><p>Fútbol en tiempo real</p></div>
  </div>
  <div class="menu-title">Principal</div>
  <a href="index.html">🏠 <span>Inicio</span></a>
  <a href="noticias.html">📰 <span>Noticias</span></a>
  <a href="partidos.html">📅 <span>Partidos</span></a>
  <a class="active" href="tabla.html">📊 <span>Tabla</span></a>
  <a href="equipos.html">👥 <span>Equipos</span></a>
  <a href="jugadores.html">⭐ <span>Jugadores</span></a>
  <a href="historia.html">📖 <span>Historia</span></a>
  <a href="comunidad.html">💬 <span>Comunidad</span></a>
</div>

<div class="main">
  <div class="topbar">
    <input class="search" type="text" placeholder="Buscar equipos, jugadores o ligas...">
    <div class="avatar"></div>
  </div>

  <h2 class="section-title">📊 Tabla de Posiciones — La Liga</h2>

  <div class="tabla-container">
    <div id="tabla"><p class="loading">⏳ Cargando tabla...</p></div>
  </div>
</div>

<script>
async function cargarTabla(){
  const contenedor = document.getElementById("tabla");
  try{
    const response = await fetch("/api/tabla");
    if(!response.ok) throw new Error(`Error ${response.status}`);
    const data = await response.json();

    const equipos = data.standings[0].table;

    let html = `
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Equipo</th>
            <th>PJ</th>
            <th>G</th>
            <th>E</th>
            <th>P</th>
            <th>GF</th>
            <th>Pts</th>
          </tr>
        </thead>
        <tbody>
    `;

    equipos.forEach(t => {
      html += `
        <tr>
          <td class="pos">${t.position}</td>
          <td class="team-name">${t.team.name}</td>
          <td>${t.playedGames}</td>
          <td>${t.won}</td>
          <td>${t.draw}</td>
          <td>${t.lost}</td>
          <td class="goles">${t.goalsFor}</td>
          <td class="pts">${t.points}</td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    contenedor.innerHTML = html;

  }catch(error){
    contenedor.innerHTML = `<p class="error-msg">❌ Error cargando tabla: ${error.message}</p>`;
  }
}
cargarTabla();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidos de Fútbol</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .contenedor {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .match-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,.1);
            transition: .3s;
        }

        .match-card:hover {
            transform: translateY(-3px);
        }

        .competition {
            color: #1d4ed8;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin: 15px 0;
        }

        .vs {
            color: #e63946;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            background: #22c55e;
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }

        .loading,
        .error {
            text-align: center;
            padding: 30px;
            font-size: 18px;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>⚽ Partidos de Fútbol</h1>

    <div id="matches" class="contenedor">
        <div class="loading">Cargando partidos...</div>
    </div>

    <script>
        const API_KEY = "TU_API_KEY";

        async function cargarPartidos() {

            const contenedor = document.getElementById("matches");

            try {

                const response = await fetch(
                    "https://api.football-data.org/v4/matches",
                    {
                        headers: {
                            "X-Auth-Token": API_KEY
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        `Error ${response.status}: ${response.statusText}`
                    );
                }

                const data = await response.json();

                if (!data.matches || data.matches.length === 0) {
                    contenedor.innerHTML = `
                        <div class="error">
                            No se encontraron partidos.
                        </div>
                    `;
                    return;
                }

                let html = "";

                data.matches.slice(0, 12).forEach(match => {

                    html += `
                        <div class="match-card">

                            <div class="competition">
                                ${match.competition.name}
                            </div>

                            <div class="teams">
                                <span>${match.homeTeam.name}</span>

                                <span class="vs">VS</span>

                                <span>${match.awayTeam.name}</span>
                            </div>

                            <p>
                                📅 ${new Date(
                                    match.utcDate
                                ).toLocaleString("es-EC")}
                            </p>

                            <div class="status">
                                ${match.status}
                            </div>

                        </div>
                    `;
                });

                contenedor.innerHTML = html;

            } catch (error) {

                console.error(error);

                contenedor.innerHTML = `
                    <div class="error">
                        ❌ Error al conectar con Football Data API
                        <br><br>
                        ${error.message}
                    </div>
                `;
            }
        }

        cargarPartidos();
    </script>

</body>

</html>

<div class="main">

<h1>Partidos Reales</h1>

<div id="matches"></div>

</div>

<script>

const API_KEY = "c1c9cfed0b354edca2ce6b220447352c";

fetch("https://api.football-data.org/v4/matches", {
headers:{
"X-Auth-Token": API_KEY
}
})
.then(response => response.json())
.then(data => {

const matches = document.getElementById("matches");


data.matches.slice(0,10).forEach(match => {

matches.innerHTML += `

<div class="card">

<h2>
${match.homeTeam.name}
vs
${match.awayTeam.name}
</h2>

<p>
📅 ${new Date(match.utcDate).toLocaleString()}
</p>

<p>
🏆 ${match.competition.name}
</p>

<p>
📌 Estado: ${match.status}
</p>

</div>

`;

});

});

</script>

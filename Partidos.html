<!DOCTYPE html>
<script>

const API_KEY = "c1c9cfed0b354edca2ce6b220447352c";

async function cargarPartidos(){

try{

const response = await fetch("https://api.football-data.org/v4/matches", {
headers:{
"X-Auth-Token": API_KEY
}
});

const data = await response.json();

const matches = document.getElementById("matches");

if(!data.matches){

matches.innerHTML = `
<div class="card">
<h2>Error de API</h2>
<p>No se pudieron cargar los partidos.</p>
</div>
`;

return;
}


data.matches.slice(0,12).forEach(match => {

matches.innerHTML += `

<div class="card match-card">

<h3>${match.competition.name}</h3>

<div class="teams">
<span>${match.homeTeam.name}</span>
<span>VS</span>
<span>${match.awayTeam.name}</span>
</div>

<p>📅 ${new Date(match.utcDate).toLocaleString()}</p>

<div class="status">
${match.status}
</div>

</div>

`;

});

}catch(error){
console.log(error);

document.getElementById("matches").innerHTML = `
<div class="card">
<h2>Error conectando API</h2>
<p>Tu API de Football Data puede haber excedido el límite gratis.</p>
</div>
`;
}
}

cargarPartidos();

</script>

</body>
</html>

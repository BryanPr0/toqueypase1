<!DOCTYPE html>

<p style="margin-top:10px;color:#9ca3af;">
Noticias deportivas actualizadas automáticamente.
</p>

<div id="loading" class="loading">
Cargando noticias...
</div>

<div id="news" class="news-grid"></div>

</div>

<script>

const API_KEY = "db1537ad04e74bdc509c10231c09b19a";

async function cargarNoticias(){

try{

const response = await fetch(`https://gnews.io/api/v4/search?q=futbol&lang=es&country=es&max=10&apikey=${API_KEY}`);

const data = await response.json();

const news = document.getElementById("news");
const loading = document.getElementById("loading");

loading.style.display = "none";

if(!data.articles || data.articles.length === 0){
news.innerHTML = `
<div class="card">
<h2>No se pudieron cargar noticias</h2>
<p>Revisa tu API KEY de GNews.</p>
</div>
`;
return;
}


data.articles.forEach(article => {

news.innerHTML += `

<div class="card news-card">

<img src="${article.image || 'https://via.placeholder.com/600x300'}">

<h2>${article.title}</h2>

<p>${article.description || 'Sin descripción disponible.'}</p>

<a class="btn" href="${article.url}" target="_blank">
Leer noticia
</a>

</div>

`;

});

}catch(error){
console.log(error);

document.getElementById("loading").innerHTML = `
❌ Error cargando noticias.<br><br>
Posible problema:
<ul>
<li>API KEY inválida</li>
<li>Límite de peticiones alcanzado</li>
<li>Endpoint incorrecto</li>
</ul>
`;
}
}

cargarNoticias();

</script>

</body>
</html>

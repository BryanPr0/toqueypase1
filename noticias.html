<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noticias | Toque & Pase</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050816;
color:white;
display:flex;
}

/* SIDEBAR */

.sidebar{
width:260px;
height:100vh;
background:#0b1020;
border-right:1px solid #1f2937;
padding:25px;
position:fixed;
overflow-y:auto;
}

.logo{
display:flex;
align-items:center;
gap:12px;
margin-bottom:40px;
}

.logo-box{
width:50px;
height:50px;
background:#00f5a0;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
color:black;
}

.logo-text h2{
font-size:28px;
color:#00f5a0;
}

.logo-text p{
font-size:12px;
color:#94a3b8;
}

.sidebar a{
display:flex;
align-items:center;
gap:12px;
padding:14px;
border-radius:12px;
text-decoration:none;
color:#d1d5db;
transition:0.3s;
margin-bottom:8px;
}

.sidebar a:hover,
.sidebar a.active{
background:#00f5a015;
color:#00f5a0;
}

/* MAIN */

.main{
margin-left:260px;
width:100%;
padding:30px;
}

/* HEADER */

.header{
margin-bottom:30px;
}

.header h1{
font-size:42px;
margin-bottom:10px;
}

.header p{
color:#94a3b8;
}

/* GRID */

.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:25px;
}

/* CARD */

.news-card{
background:#111827;
border:1px solid #1f2937;
border-radius:24px;
overflow:hidden;
transition:0.3s;
}

.news-card:hover{
transform:translateY(-5px);
border-color:#00f5a0;
}

.news-card img{
width:100%;
height:220px;
object-fit:cover;
}

.news-content{
padding:22px;
}

.news-source{
display:inline-block;
padding:6px 12px;
background:#00f5a015;
color:#00f5a0;
border-radius:20px;
font-size:13px;
margin-bottom:15px;
}

.news-content h2{
font-size:24px;
line-height:1.4;
margin-bottom:15px;
}

.news-content p{
color:#bfc7d5;
line-height:1.7;
margin-bottom:20px;
}

.news-footer{
display:flex;
justify-content:space-between;
align-items:center;
}

.date{
color:#9ca3af;
font-size:14px;
}

.btn{
padding:12px 18px;
background:#00f5a0;
color:black;
text-decoration:none;
border-radius:12px;
font-weight:600;
}

/* LOADING */

.loading{
height:300px;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
color:#00f5a0;
}

.error{
background:#111827;
padding:30px;
border-radius:20px;
border:1px solid #ef4444;
}

@media(max-width:768px){

.sidebar{
width:100px;
padding:15px;
}

.logo-text,
.sidebar a span{
display:none;
}

.main{
margin-left:100px;
padding:20px;
}

.news-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">

<div class="logo-box">
⚽
</div>

<div class="logo-text">
<h2>Toque & Pase</h2>
<p>Noticias deportivas</p>
</div>

</div>

<a href="index.html">
🏠 <span>Inicio</span>
</a>

<a class="active" href="noticias.html">
📰 <span>Noticias</span>
</a>

<a href="partidos.html">
📅 <span>Partidos</span>
</a>

<a href="tabla.html">
📊 <span>Tabla</span>
</a>

<a href="equipos.html">
👥 <span>Equipos</span>
</a>

<a href="jugadores.html">
⭐ <span>Jugadores</span>
</a>

<a href="historia.html">
📖 <span>Historia</span>
</a>

<a href="comunidad.html">
💬 <span>Comunidad</span>
</a>

</div>

<!-- MAIN -->

<div class="main">

<div class="header">

<h1>
📰 Noticias de Fútbol
</h1>

<p>
Noticias deportivas internacionales en tiempo real.
</p>

</div>

<div id="loading" class="loading">
Cargando noticias...
</div>

<div id="news" class="news-grid"></div>

</div>

<script>

/*

REEMPLAZA ESTO CON TU API KEY

*/

const API_KEY = "pub_4dac460ecf344979bee8f59bd9c04ca4";

async function cargarNoticias(){

try{

const response = await fetch(
`https://newsdata.io/api/1/news?apikey=${API_KEY}&q=futbol&language=es`
);

const data = await response.json();

document.getElementById("loading").style.display = "none";

const news = document.getElementById("news");

if(!data.results){

news.innerHTML = `
<div class="error">
<h2>❌ Error cargando noticias</h2>
<p>La API no respondió correctamente.</p>
</div>
`;

return;

}

data.results.forEach(article => {

news.innerHTML += `

<div class="news-card">

<img src="${article.image_url || 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1200&auto=format&fit=crop'}">

<div class="news-content">

<div class="news-source">
${article.source_id || 'Fútbol'}
</div>

<h2>
${article.title}
</h2>

<p>
${article.description || 'Noticias deportivas actualizadas.'}
</p>

<div class="news-footer">

<div class="date">
${article.pubDate || ''}
</div>

<a class="btn" href="${article.link}" target="_blank">
Leer más
</a>

</div>

</div>

</div>

`;

});

}catch(error){

console.log(error);

document.getElementById("loading").innerHTML = `

<div class="error">

<h2>
❌ Error conectando API
</h2>

<p>
Verifica tu API KEY de NewsData.io
</p>

</div>

`;

}

}

cargarNoticias();

</script>

</body>
</html>
